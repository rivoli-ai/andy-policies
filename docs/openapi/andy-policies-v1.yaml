components:
  schemas:
    AppliedOverrideDto:
      type: object
      properties:
        overrideId:
          type: string
          format: uuid
        effect:
          $ref: '#/components/schemas/OverrideEffect'
        scopeKind:
          $ref: '#/components/schemas/OverrideScopeKind'
        scopeRef:
          type: string
          nullable: true
        originalPolicyVersionId:
          type: string
          format: uuid
        replacementPolicyVersionId:
          type: string
          format: uuid
          nullable: true
      additionalProperties: false
    ApproveOverrideRequest:
      type: object
      properties:
        rationale:
          type: string
          nullable: true
      additionalProperties: false
      description: Audit rationale supplied by the override approver.
    AuditEventDto:
      type: object
      properties:
        id:
          type: string
          description: Stable random GUID assigned at write time.
          format: uuid
        seq:
          type: integer
          description: "DB-assigned monotonic sequence number; chain\n            verification walks rows ordered by this column."
          format: int64
        prevHashHex:
          type: string
          description: "Lowercase hex of the previous row's\n            `Hash`; 64 zero chars for the genesis row."
          nullable: true
        hashHex:
          type: string
          description: "Lowercase hex of\n            `SHA-256(prevHash || canonicalJson(payload))`."
          nullable: true
        timestamp:
          type: string
          description: UTC instant the event was written.
          format: date-time
        actorSubjectId:
          type: string
          description: JWT `sub` claim of the actor.
          nullable: true
        actorRoles:
          type: array
          items:
            type: string
          description: Snapshot of actor RBAC roles.
          nullable: true
        action:
          type: string
          description: "Dotted action code (e.g.\n            `policy.version.publish`)."
          nullable: true
        entityType:
          type: string
          description: Canonical type of the mutated entity.
          nullable: true
        entityId:
          type: string
          description: "String form of the mutated entity's\n            primary key."
          nullable: true
        fieldDiff:
          description: "Parsed RFC 6902 JSON Patch document.\n            Travels on the wire as a JSON array (P6.6, story\n            rivoli-ai/andy-policies#46) — not as a JSON-encoded string —\n            so consumers can `jq '.fieldDiff[0].op'` directly without\n            a second parse. Defaults to `[]` for create / delete\n            events whose diff is implicit."
        rationale:
          type: string
          description: "Free-text rationale supplied by the\n            actor; nullable when the rationale-required filter is off."
          nullable: true
      additionalProperties: false
      description: "Wire-format projection of `Andy.Policies.Domain.Entities.AuditEvent`\n(P6.2, story rivoli-ai/andy-policies#42). Hashes travel as\nlowercase hex strings so REST/MCP/gRPC consumers don't have to\nagree on a binary encoding; the binary form stays in the\ndatabase column."
    AuditPageDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEventDto'
          description: "Audit events for this page, ordered by\n            `Seq` ascending."
          nullable: true
        nextCursor:
          type: string
          description: "Opaque base64-URL encoded boundary\n            for the next page. Null when no more rows match the\n            filter."
          nullable: true
        pageSize:
          type: integer
          description: "Echo of the requested page size.\n            Useful for clients that paginate based on the server's\n            honoured value (e.g. when the request omits the parameter\n            and gets the default)."
          format: int32
      additionalProperties: false
      description: "Cursor-paginated response from `GET /api/audit` (P6.6,\nstory rivoli-ai/andy-policies#46). Cursor pagination is\nchosen over offset because the audit table grows\nmonotonically — offset windows would shift under concurrent\ninserts, and skipping the head of a million-row table is a\nscan, not a seek."
    BindStrength:
      enum:
        - Mandatory
        - Recommended
      type: string
    BindingDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        policyVersionId:
          type: string
          format: uuid
        targetType:
          $ref: '#/components/schemas/BindingTargetType'
        targetRef:
          type: string
          nullable: true
        bindStrength:
          $ref: '#/components/schemas/BindStrength'
        createdAt:
          type: string
          format: date-time
        createdBySubjectId:
          type: string
          nullable: true
        deletedAt:
          type: string
          format: date-time
          nullable: true
        deletedBySubjectId:
          type: string
          nullable: true
      additionalProperties: false
      description: "Wire-format projection of a `Binding` (P3.2, story\nrivoli-ai/andy-policies#20). Surface controllers (REST, MCP, gRPC, CLI)\nemit this shape directly so wire behavior stays uniform.\nAndy.Policies.Application.Dtos.BindingDto.DeletedAt is non-null when the binding has been\nsoft-deleted; service-layer reads filter tombstoned rows by default."
    BindingTargetType:
      enum:
        - Template
        - Repo
        - ScopeNode
        - Tenant
        - Org
        - Agent
      type: string
    BumpPolicyVersionRequest:
      type: object
      properties:
        rationale:
          type: string
          nullable: true
      additionalProperties: false
      description: Audit rationale for creating a new Draft from a source version.
    BundleContentsBindingDto:
      type: object
      properties:
        bindingId:
          type: string
          format: uuid
        targetType:
          type: string
          nullable: true
        targetRef:
          type: string
          nullable: true
        bindStrength:
          type: string
          nullable: true
      additionalProperties: false
    BundleContentsDto:
      type: object
      properties:
        bundleId:
          type: string
          format: uuid
        bundleName:
          type: string
          nullable: true
        snapshotHash:
          type: string
          nullable: true
        capturedAt:
          type: string
          format: date-time
        policies:
          type: array
          items:
            $ref: '#/components/schemas/BundleContentsPolicyDto'
          nullable: true
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/BundleContentsOverrideDto'
          nullable: true
      additionalProperties: false
      description: "Denormalised contents view of a frozen bundle (P9 follow-up #204,\n2026-05-07). Consumers (the bundle detail page) render this as a\ntree: policies grouped by name, each expandable to its bindings,\nplus a flat list of overrides. `SnapshotHash` is the same\nstrong validator the resolution endpoints emit so callers can\nshare an HTTP cache between this endpoint and `/resolve`."
    BundleContentsOverrideDto:
      type: object
      properties:
        overrideId:
          type: string
          format: uuid
        policyVersionId:
          type: string
          format: uuid
        scopeKind:
          type: string
          nullable: true
        scopeRef:
          type: string
          nullable: true
        effect:
          type: string
          nullable: true
        replacementPolicyVersionId:
          type: string
          format: uuid
          nullable: true
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
    BundleContentsPolicyDto:
      type: object
      properties:
        policyId:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        policyVersionId:
          type: string
          format: uuid
        version:
          type: integer
